# ذاكرة محدودة عن قصد: الحاوية 15Gi، وطلب 8G للـ Gradle مع 4G للـ metaspace
# يترك العملية بلا هامش لحظة تشغيل Kotlin daemon، فيقتل النظام الجلسة كلها
# ويتوقف البناء في منتصفه. 3G تكفي هذا المشروع.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
kotlin.caching.enabled=false
